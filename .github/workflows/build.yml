name: Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure Windows x64
        run: cmake --preset windows-vst3
      - name: Build VST3 and tests
        run: cmake --build --preset windows-vst3
      - name: Test
        run: ctest --preset windows-vst3
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item 'build-windows/plugin/TONE3000_artefacts/Release/VST3/Local Rig.vst3' dist -Recurse
          Copy-Item LICENSE, docs/WINDOWS.md dist
          Compress-Archive -Path dist/* -DestinationPath Local-Rig-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Local-Rig-Windows-x64
          path: Local-Rig-Windows-x64.zip
          if-no-files-found: error
